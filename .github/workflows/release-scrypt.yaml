name: Sparrow-Scrypt release builds

on:
  push:
    tags:
      - 'scrypt-v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  JDK_JAVAC_OPTIONS: '-Xlint:-module'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04, macos-15-intel, macos-15]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          persist-credentials: false
      - name: Clear Java tool-cache for reproducibility
        shell: bash
        run: rm -rf "$RUNNER_TOOL_CACHE"/Java_*
      - name: Set up JDK 25.0.5
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: 'temurin'
          java-version: '25.0.5'
      - name: Read the version
        shell: bash
        run: echo "VERSION=$(sed -n "s/^version = '\(.*\)'/\1/p" build.gradle)" >> "$GITHUB_ENV"
      # The app image, plus the Windows msi and the Linux deb (macOS gets no installer, only the zipped app)
      - name: Build the app image and installer
        run: ./gradlew jpackage -PlinuxInstallerType=deb
      - name: Package Windows zip
        if: ${{ runner.os == 'Windows' }}
        run: ./gradlew packageZipDistribution
      - name: Package Linux tar
        if: ${{ runner.os == 'Linux' }}
        run: ./gradlew packageTarDistribution
      # jpackage compresses the deb with zstd, which older dpkg versions cannot read
      - name: Repackage Linux deb
        if: ${{ runner.os == 'Linux' }}
        run: ./repackage.sh
      # Not notarized: an ad-hoc signature lets the app run on Apple Silicon once the quarantine flag is cleared
      - name: Sign ad hoc and zip the macOS app
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          codesign --force --deep --sign - build/jpackage/Sparrow-Scrypt.app
          codesign --verify --deep --strict build/jpackage/Sparrow-Scrypt.app
          arch=$([ "$RUNNER_ARCH" = "ARM64" ] && echo aarch64 || echo x86_64)
          ditto -c -k --keepParent build/jpackage/Sparrow-Scrypt.app "build/jpackage/Sparrow-Scrypt-${VERSION}-macos-${arch}.zip"
      - name: Checksums
        shell: bash
        run: |
          cd build/jpackage
          for f in *.zip *.tar.gz *.msi *.deb; do [ -f "$f" ] || continue; if command -v sha256sum >/dev/null; then sha256sum "$f"; else shasum -a 256 "$f"; fi; done > "SHA256SUMS-${RUNNER_OS}-${RUNNER_ARCH}.txt"
          cat SHA256SUMS-*.txt
      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Sparrow-Scrypt ${{ runner.os }} ${{ runner.arch }}
          path: |
            build/jpackage/*.zip
            build/jpackage/*.tar.gz
            build/jpackage/*.msi
            build/jpackage/*.deb
            build/jpackage/SHA256SUMS-*.txt
          retention-days: 14
